name: CI

# Run on every push, to any branch
on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest exits with a non-zero code if any test fails,
      # which makes this step (and the pipeline) fail.
      - name: Run tests
        run: pytest -v --junitxml=junit.xml

      # The steps below use "if: always()" so they also run when tests fail.
      - name: Build test report
        if: always()
        run: |
          python build_report.py junit.xml report.json
          cat report.json

      - name: Send report to local receiver
        if: always()
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -z "$RECEIVER_URL" ]; then
            echo "::warning::RECEIVER_URL secret is not set - report not sent."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --max-time 30 \
            -X POST "$RECEIVER_URL" \
            -H "Content-Type: application/json" \
            -H "X-Report-Token: $REPORT_TOKEN" \
            --data-binary @report.json

      - name: Email test report
        if: always()
        env:
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: python send_email.py report.json

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: report.json

  # Bonus: publish the static demo to GitHub Pages.
  # "needs: test" means this job only runs if every test passed,
  # so a failing run leaves the previously published site unchanged.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v5

      - name: Stamp the commit into the page
        run: sed -i "s/__COMMIT__/${GITHUB_SHA::7}/" site/*.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
